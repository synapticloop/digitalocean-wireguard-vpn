{% extends 'base.html' %}{% block content %}<h2>Commit WireGuard config</h2><form method="post">{% csrf_token %}<button>Generate, validate and apply config</button></form><h3>Recent commits</h3><table><tr><th>Time</th><th>Actor</th><th>Status</th><th>Summary</th><th>Error</th></tr>{% for c in commits %}<tr><td>{{ c.created_at }}</td><td>{{ c.actor }}</td><td>{{ c.status }}</td><td><pre>{{ c.summary }}</pre></td><td><pre class="danger">{{ c.error }}</pre></td></tr>{% endfor %}</table>{% endblock %}
