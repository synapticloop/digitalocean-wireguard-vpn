{% extends 'base.html' %}{% block content %}<h2>Peers</h2><form method="post" action="{% url 'commit_config' %}">{% csrf_token %}<button>Commit WireGuard config</button></form><table><tr><th>User</th><th>Device</th><th>VPN IP</th><th>Enabled</th><th>Latest handshake</th></tr>{% for peer in peers %}<tr><td>{{ peer.user.username }}</td><td>{{ peer.name }}</td><td>{{ peer.vpn_ipv4 }}</td><td>{{ peer.enabled }}</td><td>{{ peer.latest_handshake_at|default:'-' }}</td></tr>{% endfor %}</table>{% endblock %}
